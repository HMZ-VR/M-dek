server {
    listen 80;
    server_name _;

    # Sunucu versiyon bilgisini gizle
    server_tokens off;

    # Dosya yükleme boyut sınırı (backend ile uyumlu: 50 MB)
    client_max_body_size 50m;

    # ── Güvenlik başlıkları ──────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # Statik frontend
    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ────────────────────────────────────────
    location /api/ {
        # Genel API rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
    }

    # ── Login endpoint — sıkı rate limiting ──────────────────────
    location = /api/login {
        limit_req zone=api_login burst=3 nodelay;

        proxy_pass         http://api:8000/api/login;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Şifre sıfırlama talebi — sıkı rate limiting (spam koruması) ──
    location = /api/forgot-password {
        limit_req zone=api_reset burst=2 nodelay;

        proxy_pass         http://api:8000/api/forgot-password;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Dosya upload endpoint'leri — orta rate limiting ──────────
    location ~ ^/api/committees/.*/upload {
        limit_req zone=api_upload burst=5 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ~ ^/api/committees/.*/attachments$ {
        limit_req zone=api_upload burst=5 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Sağlık kontrolü
    location /health {
        proxy_pass http://api:8000/health;
    }

    # Statikler — cache başlıkları
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}