# Rate limiting zone tanımları — http context'te yüklenir (00- prefix ile default.conf'tan önce)
# Genel API istekleri: IP başına saniyede 30 istek
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Login endpoint'i: IP başına dakikada 5 istek (brute-force koruması)
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;

# Şifre sıfırlama talebi: IP başına dakikada 3 istek (spam/enumeration koruması)
limit_req_zone $binary_remote_addr zone=api_reset:10m rate=3r/m;

# Dosya upload: IP başına dakikada 10 istek (disk doldurma koruması)
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/m;
