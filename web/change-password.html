<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Değiştir – MÜDEK</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="assets/ktun-design.css">
  <style>
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:42px; }
    .pw-toggle {
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      background:transparent; border:none; cursor:pointer;
      color:var(--muted); padding:6px;
      width:30px; height:30px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }
    .pw-toggle:hover { color:var(--navy); background:var(--cream); }
  </style>
</head>
<body>

<div id="topbarMount"></div>
<div id="heroMount"></div>

<main class="page-body" style="max-width:520px">
  <div class="card">
    <div class="alert alert-warning hidden" id="firstLoginBanner">
      <span class="mi">warning</span>
      <div><strong>İlk giriş:</strong> Güvenlik için varsayılan şifrenizi değiştirmeniz gerekiyor.</div>
    </div>

    <div class="card-title"><span class="mi" style="color:var(--gold-dk)">key</span> Şifre Değiştir</div>

    <form id="passwordForm">
      <div class="mb-3">
        <label for="oldPassword">Mevcut Şifre</label>
        <div class="pw-wrap">
          <input type="password" id="oldPassword" required autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="oldPassword"><span class="mi">visibility</span></button>
        </div>
      </div>
      <div class="mb-3">
        <label for="newPassword">Yeni Şifre</label>
        <div class="pw-wrap">
          <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="newPassword"><span class="mi">visibility</span></button>
        </div>
        <div class="form-help">En az 8 karakter olmalı.</div>
      </div>
      <div class="mb-3">
        <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
        <div class="pw-wrap">
          <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirmPassword"><span class="mi">visibility</span></button>
        </div>
      </div>
      <button type="submit" id="submitBtn" class="btn w-full"><span class="mi">check</span> Şifreyi Değiştir</button>
      <div id="status" class="alert hidden mt-3"></div>
    </form>
  </div>
</main>

<script src="assets/ktun-shell.js"></script>
<script src="help-widget.js" defer></script>
<script>
  const auth = KTUN.requireAuth();
  if (!auth) throw new Error('redirecting');
  KTUN.renderTopbar({ back:{ href:'dashboard.html', label:'Panele Dön' } });
  KTUN.renderHero({
    eyebrow:'Hesap Güvenliği',
    title:'Şifre <em>Değiştir</em>',
    sub:'Güçlü ve benzersiz bir şifre seçin.',
  });
  KTUN.renderFooter();

  const isFirst = new URLSearchParams(location.search).get('first') === '1' || auth.user.must_change_password === true;
  if (isFirst) document.getElementById('firstLoginBanner').classList.remove('hidden');

  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = document.getElementById(btn.dataset.target);
      const icon = btn.querySelector('.mi');
      if (inp.type === 'password') { inp.type = 'text'; icon.textContent = 'visibility_off'; }
      else { inp.type = 'password'; icon.textContent = 'visibility'; }
    });
  });

  const form      = document.getElementById('passwordForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl  = document.getElementById('status');

  function show(msg, kind) {
    statusEl.classList.remove('hidden');
    statusEl.className = 'alert alert-' + (kind === 'success' ? 'success' : 'danger') + ' mt-3';
    statusEl.innerHTML = `<span class="mi">${kind === 'success' ? 'check_circle' : 'error'}</span><div>${KTUN.htmlEscape(msg)}</div>`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const oldPwd = document.getElementById('oldPassword').value;
    const newPwd = document.getElementById('newPassword').value;
    const conf   = document.getElementById('confirmPassword').value;
    if (newPwd !== conf)        return show('Yeni şifreler eşleşmiyor!', 'err');
    if (newPwd.length < 8)      return show('Yeni şifre en az 8 karakter olmalı!', 'err');
    if (oldPwd === newPwd)      return show('Yeni şifre eski şifreden farklı olmalı!', 'err');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="mi">hourglass_top</span> Değiştiriliyor…';
    try {
      const res = await KTUN.apiFetch('/api/change-password', {
        method:'POST',
        body: JSON.stringify({ old_password: oldPwd, new_password: newPwd }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Şifre değiştirme başarısız');
      // Güvenlik: parola değişiminde mevcut token revoke edilir.
      // Kullanıcıyı yeni şifresiyle tekrar giriş yapmaya yönlendir.
      sessionStorage.clear();
      show('Şifreniz başarıyla değiştirildi. Yeni şifrenizle giriş yapın…', 'success');
      form.reset();
      setTimeout(() => location.href = 'login.html', 1500);
    } catch (err) {
      show(err.message, 'err');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span class="mi">check</span> Şifreyi Değiştir';
    }
  });
</script>
</body>
</html>
