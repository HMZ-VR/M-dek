<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MÜDEK – Şifre Sıfırla</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="assets/ktun-design.css">
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .login-shell {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(11,31,69,.08), transparent 60%),
        radial-gradient(900px 500px at 80% 90%, rgba(201,168,76,.10), transparent 60%),
        var(--cream);
    }
    .login-card {
      background:var(--white); border-radius:var(--r);
      border-top:3px solid var(--gold);
      box-shadow:var(--shadow-lg);
      width:100%; max-width:420px;
      padding:40px 36px;
      animation:fadeIn .5s ease forwards;
    }
    .login-seal {
      width:84px; height:84px; border-radius:50%;
      background:var(--white); border:2px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 14px; overflow:hidden;
    }
    .login-seal img { width:72px; height:72px; object-fit:contain; }
    .login-eyebrow {
      text-align:center; font-size:10.5px; font-weight:600; letter-spacing:1.8px;
      text-transform:uppercase; color:var(--gold-dk); margin-bottom:6px;
    }
    .login-title {
      text-align:center; font-family:'Playfair Display',serif;
      font-size:24px; font-weight:700; color:var(--navy); margin-bottom:6px;
    }
    .login-sub { text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:26px; }
    .input-group { margin-bottom:14px; }
    .pw-hint { font-size:11.5px; color:var(--muted); margin-top:-6px; margin-bottom:14px; }
    .login-msg { margin-top:12px; display:none; font-size:13px; padding:10px 12px; border-radius:var(--r-sm); }
    .login-msg.error { display:block; background:rgba(184,39,44,.06); color:var(--red); border:1px solid rgba(184,39,44,.2); }
    .login-msg.success { display:block; background:rgba(5,150,105,.06); color:var(--green); border:1px solid rgba(5,150,105,.25); }
    .login-foot {
      text-align:center; font-size:11.5px; color:var(--muted); padding:18px 12px; border-top:1px solid var(--border);
    }
    .login-extra { margin-top:18px; text-align:center; }
    .login-link {
      display:inline-flex; align-items:center; gap:6px;
      font-size:12.5px; color:var(--muted); font-weight:500;
    }
    .login-link:hover { color:var(--navy); }
    .login-link .mi { font-size:16px; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }
  </style>
</head>
<body>

<main class="login-shell">
  <div class="login-card">
    <div class="login-seal"><img src="ktun-logo.png" alt="KTÜ"></div>
    <div class="login-eyebrow">Konya Teknik Üniversitesi</div>
    <h1 class="login-title">Yeni Şifre Belirle</h1>
    <div class="login-sub">Hesabınız için yeni bir şifre oluşturun.</div>

    <form id="resetForm" autocomplete="off">
      <div class="input-group">
        <label for="newPassword">Yeni Şifre</label>
        <input type="password" id="newPassword" autocomplete="new-password" required>
      </div>
      <div class="pw-hint">En az 8 karakter, en az bir harf ve bir rakam içermelidir.</div>
      <div class="input-group">
        <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required>
      </div>
      <button id="submitBtn" type="submit" class="btn btn-lg w-full">
        <span class="mi">lock_reset</span> Şifremi Güncelle
      </button>
      <div class="login-msg" id="errorMsg"></div>
      <div class="login-msg" id="successMsg"></div>
      <div class="login-extra">
        <a href="login.html" class="login-link">
          <span class="mi">arrow_back</span> Girişe dön
        </a>
      </div>
    </form>
  </div>
</main>

<footer class="login-foot">
  © <span id="yr"></span> <strong>Konya Teknik Üniversitesi</strong> — MÜDEK Akreditasyon Projesi
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  const API_BASE = '';
  const token = new URLSearchParams(window.location.search).get('token') || '';

  const form = document.getElementById('resetForm');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const submitBtn = document.getElementById('submitBtn');

  function setMsg(el, txt, klass) {
    el.textContent = txt;
    el.className = 'login-msg ' + klass;
    el.style.display = '';
  }
  function clearMsgs() {
    errorMsg.style.display = 'none'; errorMsg.textContent = '';
    successMsg.style.display = 'none'; successMsg.textContent = '';
  }

  if (!token) {
    setMsg(errorMsg, 'Geçersiz veya eksik bağlantı. Lütfen sıfırlama talebini yeniden başlatın.', 'error');
    submitBtn.disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword.length < 8) {
      setMsg(errorMsg, 'Şifre en az 8 karakter olmalıdır.', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      setMsg(errorMsg, 'Şifreler eşleşmiyor.', 'error');
      return;
    }
    submitBtn.disabled = true;
    const originalBtn = submitBtn.innerHTML;
    submitBtn.innerHTML = '<span class="mi">hourglass_top</span> Güncelleniyor…';

    try {
      const res = await fetch(`${API_BASE}/api/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: newPassword }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || data.message || 'Şifre güncellenemedi.');
      setMsg(successMsg, (data.message || '✅ Şifreniz güncellendi.') + ' Giriş sayfasına yönlendiriliyorsunuz…', 'success');
      setTimeout(() => { location.href = 'login.html'; }, 1500);
    } catch (err) {
      setMsg(errorMsg, err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalBtn;
    }
  });
</script>
</body>
</html>
