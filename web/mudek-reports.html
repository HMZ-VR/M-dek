<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MÜDEK Denetim Masası</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="assets/ktun-design.css">
  <style>
    .stat-mini {
      background:var(--white); border:1px solid var(--border);
      border-radius:var(--r); padding:18px 20px;
      box-shadow:var(--shadow);
      border-left:4px solid var(--navy);
    }
    .stat-mini.green { border-left-color:var(--green); }
    .stat-mini.amber { border-left-color:var(--amber); }
    .stat-mini-lbl { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .stat-mini-val { font-family:'Playfair Display', serif; font-size:30px; font-weight:700; margin-top:6px; color:var(--navy); }
    .stat-mini.green .stat-mini-val { color:var(--green); }
    .stat-mini.amber .stat-mini-val { color:var(--amber); }
    .stats-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:22px; }
    .pc-tbl { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
    .pc-tbl th, .pc-tbl td { padding:6px 8px; border:1px solid var(--border); text-align:left; }
    .pc-tbl th { background:var(--cream); color:var(--navy); font-weight:600; }
    .pc-tbl td.pct { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
    .pc-tbl td.pct.green { color:var(--green); }
    .pc-tbl td.pct.amber { color:var(--amber); }
    .pc-tbl td.pct.red { color:var(--red); }
    .pc-empty { color:var(--muted); font-size:12px; padding:8px 0; }
  </style>
</head>
<body>

<div id="topbarMount"></div>
<div id="heroMount"></div>

<main class="page-body">

  <div class="stats-grid">
    <div class="stat-mini">
      <div class="stat-mini-lbl">Toplam Sınav</div>
      <div class="stat-mini-val" id="totalCourses">—</div>
    </div>
    <div class="stat-mini green">
      <div class="stat-mini-lbl">Tamamlanan Raporlar</div>
      <div class="stat-mini-val" id="completedReports">—</div>
    </div>
    <div class="stat-mini amber">
      <div class="stat-mini-lbl">Eksik Raporlar</div>
      <div class="stat-mini-val" id="missingReports">—</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="mi" style="color:var(--gold-dk)">fact_check</span> Ders Değerlendirme Listesi</div>
    <div class="table-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>Ders Kodu</th>
            <th>Ders Adı</th>
            <th>Hoca</th>
            <th>Tarih</th>
            <th>Durum</th>
            <th>MÜDEK Görüşü</th>
            <th style="text-align:right">İşlem</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">Veriler yükleniyor…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- Modal -->
<div id="reviewModal" class="modal" style="display:none">
  <div class="modal-content">
    <button class="btn-ghost" id="modalClose" style="position:absolute;top:14px;right:14px;font-size:18px"><span class="mi">close</span></button>
    <h2 style="font-family:'Playfair Display', serif;color:var(--navy);font-size:22px;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:20px;">
      DDR İnceleme &amp; Onay
    </h2>

    <div style="margin-bottom:14px;">
      <label style="font-weight:600;color:var(--navy);font-size:13px;">1. Durum Analizi (Hoca)</label>
      <textarea id="readAnalysis" rows="3" disabled style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--cream);color:var(--text);margin-top:6px;font-family:inherit;font-size:13px;"></textarea>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-weight:600;color:var(--navy);font-size:13px;">2. İyileştirme Planı (Hoca)</label>
      <textarea id="readAction" rows="3" disabled style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--cream);color:var(--text);margin-top:6px;font-family:inherit;font-size:13px;"></textarea>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-weight:600;color:var(--navy);font-size:13px;display:flex;align-items:center;gap:6px;">
        <span class="mi" style="font-size:16px">analytics</span> 2.5. Program Çıktısı (PÇ) Başarı Oranları
      </label>
      <div id="pcContainer" style="margin-top:6px;"></div>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-weight:600;color:var(--navy);font-size:13px;display:flex;align-items:center;gap:6px;">
        <span class="mi" style="font-size:16px">grading</span> 2.6. Harf Notu Dağılımı
      </label>
      <div id="letterContainer" style="margin-top:6px;"></div>
    </div>

    <div style="margin-bottom:18px;background:rgba(201,168,76,.08);padding:14px 16px;border-radius:var(--r-sm);border:1px solid rgba(201,168,76,.3);">
      <label style="font-weight:600;color:var(--gold-dk);display:flex;align-items:center;gap:6px;font-size:13px;">
        <span class="mi" style="font-size:16px">edit_note</span> 3. MÜDEK / Kurul Geri Bildirimi
      </label>
      <small style="display:block;color:var(--amber);margin:4px 0 8px;font-size:11.5px;">Hocanın analizi MÜDEK kriterlerine uygun mu?</small>
      <textarea id="writeFeedback" rows="4" placeholder="Görüşünüzü buraya yazın…" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;"></textarea>
    </div>

    <div style="text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:12px;">
      <span id="saveMsg" style="font-size:12px;color:var(--muted)"></span>
      <button id="btnSave" class="btn"><span class="mi">save</span> Görüşü Kaydet</button>
    </div>
  </div>
</div>

<script src="assets/ktun-shell.js"></script>
<script src="help-widget.js" defer></script>
<script>
  const auth = KTUN.requireAuth({ roles:['admin','mudek_kurul_uyesi','bolum_baskani'] });
  if (!auth) throw new Error('redirecting');
  KTUN.renderTopbar({ back:{ href:'dashboard.html', label:'Panele Dön' } });
  KTUN.renderHero({
    eyebrow:'MÜDEK Denetim',
    title:'MÜDEK <em>Denetim Masası</em>',
    sub:'Tüm derslerin DDR durumlarını inceleyin ve kurul görüşü ekleyin.',
    pill:{ icon:'fact_check', label:'Kurul Yetkisi' }
  });
  KTUN.renderFooter();

  const esc = KTUN.htmlEscape;
  const modal = document.getElementById('reviewModal');
  let currentExamId = 0;
  const examCourseMap = new Map();  // exam_id -> course_id

  function pctClass(pct) {
    if (pct >= 70) return 'green';
    if (pct >= 40) return 'amber';
    return 'red';
  }

  const LETTER_ORDER = ['AA','BA','BB','CB','CC','DC','DD','FF'];

  function renderLetterDist(dist) {
    const container = document.getElementById('letterContainer');
    const total = LETTER_ORDER.reduce((s, l) => s + (Number(dist[l]) || 0), 0);
    if (!total) {
      container.innerHTML = '<div class="pc-empty">Harf notu hesaplanmamış (sınav sonuçları eksik olabilir).</div>';
      return;
    }
    const headers = LETTER_ORDER.map(l => `<th>${l}</th>`).join('');
    const counts = LETTER_ORDER.map(l => `<td class="pct">${Number(dist[l]) || 0}</td>`).join('');
    const pcts = LETTER_ORDER.map(l => {
      const pct = total ? Math.round((Number(dist[l]) || 0) / total * 100) : 0;
      return `<td class="pct">%${pct}</td>`;
    }).join('');
    container.innerHTML = `
      <table class="pc-tbl">
        <thead><tr>${headers}<th>Toplam</th></tr></thead>
        <tbody>
          <tr>${counts}<td class="pct"><strong>${total}</strong></td></tr>
          <tr>${pcts}<td class="pct">%100</td></tr>
        </tbody>
      </table>`;
  }

  async function loadData() {
    try {
      const res = await KTUN.apiFetch('/api/admin/mudek-overview');
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      renderTable(data);
      renderStats(data);
    } catch (e) {
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="7" style="color:var(--red);text-align:center;padding:20px">Hata: ${esc(e.message)}</td></tr>`;
    }
  }

  function renderTable(data) {
    examCourseMap.clear();
    data.forEach(r => { if (r.course_id) examCourseMap.set(parseInt(r.exam_id, 10), parseInt(r.course_id, 10)); });
    const tbody = document.getElementById('tableBody');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--muted)">Kayıt yok.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(row => `
      <tr>
        <td><strong>${esc(row.course_code)}</strong></td>
        <td>${esc(row.course_name)}</td>
        <td>${esc(row.instructor_name)}</td>
        <td>${esc(row.exam_date || '—')}</td>
        <td>${row.has_report
          ? '<span class="badge badge-green"><span class="mi" style="font-size:14px">check_circle</span> Tamamlandı</span>'
          : '<span class="badge badge-amber"><span class="mi" style="font-size:14px">warning</span> Eksik</span>'}</td>
        <td>${row.feedback_text
          ? '<span class="badge badge-green"><span class="mi" style="font-size:14px">done_all</span> Yapıldı</span>'
          : '<span style="color:var(--muted);font-size:12px;">—</span>'}</td>
        <td style="text-align:right">
          <button class="btn btn-outline btn-sm" data-exam-id="${esc(row.exam_id)}">
            <span class="mi">search</span> İncele
          </button>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('button[data-exam-id]').forEach(btn => {
      btn.addEventListener('click', () => openModal(parseInt(btn.dataset.examId, 10)));
    });
  }

  function renderStats(data) {
    document.getElementById('totalCourses').textContent     = data.length;
    document.getElementById('completedReports').textContent = data.filter(d => d.has_report).length;
    document.getElementById('missingReports').textContent   = data.filter(d => !d.has_report).length;
  }

  async function openModal(examId) {
    currentExamId = examId;
    modal.style.display = 'flex';
    document.getElementById('readAnalysis').value  = 'Yükleniyor…';
    document.getElementById('readAction').value    = 'Yükleniyor…';
    document.getElementById('writeFeedback').value = '';
    document.getElementById('saveMsg').textContent = '';
    document.getElementById('pcContainer').innerHTML = '<div class="pc-empty">Yükleniyor…</div>';
    document.getElementById('letterContainer').innerHTML = '<div class="pc-empty">Yükleniyor…</div>';

    try {
      const res = await KTUN.apiFetch(`/api/exams/${examId}/reflection`);
      const d = await res.json();
      if (d.exists) {
        document.getElementById('readAnalysis').value  = d.analysis    || 'Hoca boş bırakmış.';
        document.getElementById('readAction').value    = d.action_plan || 'Hoca boş bırakmış.';
        document.getElementById('writeFeedback').value = d.feedback    || '';
      } else {
        document.getElementById('readAnalysis').value = 'Hoca henüz rapor girmemiş.';
        document.getElementById('readAction').value   = 'Hoca henüz rapor girmemiş.';
        KTUN.toast('Hoca henüz bir şey yazmamış. Yine de not düşebilirsiniz.', 'warning');
      }
    } catch (e) {
      KTUN.toast('Bağlantı hatası', 'danger');
    }

    loadPCScores(examId);
  }

  async function loadPCScores(examId) {
    const courseId = examCourseMap.get(examId);
    const container = document.getElementById('pcContainer');
    if (!courseId) {
      container.innerHTML = '<div class="pc-empty">Ders bilgisi bulunamadı.</div>';
      return;
    }
    try {
      const [analysisRes, poRes] = await Promise.all([
        KTUN.apiFetch(`/api/mudek/analysis/${courseId}`),
        KTUN.apiFetch('/api/program-outcomes'),
      ]);
      if (!analysisRes.ok) {
        container.innerHTML = '<div class="pc-empty">PÇ verileri yüklenemedi (HTTP ' + analysisRes.status + ').</div>';
        return;
      }
      const data = await analysisRes.json();
      if (data.error) {
        container.innerHTML = `<div class="pc-empty">${esc(data.error)}</div>`;
        return;
      }
      renderLetterDist(data.letter_grade_distribution || {});

      const pcAtt = data.pc_attainment || {};
      const poList = poRes.ok ? await poRes.json() : [];
      const poMeta = new Map();
      poList.forEach(p => poMeta.set(parseInt(p.id, 10), { code: p.code, title: p.title }));

      const ids = Object.keys(pcAtt).map(k => parseInt(k, 10)).filter(n => !Number.isNaN(n));
      if (!ids.length) {
        container.innerHTML = '<div class="pc-empty">PÇ skoru hesaplanmamış (sınav sonuçları eksik olabilir).</div>';
        return;
      }
      ids.sort((a, b) => {
        const ca = poMeta.get(a)?.code || '';
        const cb = poMeta.get(b)?.code || '';
        return ca.localeCompare(cb, 'tr', { numeric: true });
      });

      const rows = ids.map(id => {
        const meta = poMeta.get(id) || { code: '#' + id, title: '' };
        const raw = Number(pcAtt[id]);
        const pct = Number.isFinite(raw) ? Math.round(raw <= 1 ? raw * 100 : raw) : null;
        const cls = pct == null ? '' : pctClass(pct);
        return `<tr>
          <td><strong>${esc(meta.code)}</strong></td>
          <td>${esc(meta.title)}</td>
          <td class="pct ${cls}">${pct == null ? '—' : pct + '%'}</td>
        </tr>`;
      }).join('');

      container.innerHTML = `
        <table class="pc-tbl">
          <thead>
            <tr><th style="width:80px">Kod</th><th>Başlık</th><th style="width:90px;text-align:right">Başarı %</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (e) {
      container.innerHTML = '<div class="pc-empty">PÇ verileri yüklenemedi.</div>';
    }
  }

  function closeModal() { modal.style.display = 'none'; }

  async function saveFeedback() {
    const feedback = document.getElementById('writeFeedback').value;
    document.getElementById('saveMsg').textContent = 'Kaydediliyor…';
    try {
      const res = await KTUN.apiFetch(`/api/exams/${currentExamId}/reflection`, {
        method: 'POST',
        body: JSON.stringify({ feedback })
      });
      const data = await res.json();
      if (data.success) {
        KTUN.toast('Görüşünüz kaydedildi.', 'success');
        closeModal();
        loadData();
      } else {
        KTUN.toast('Hata: ' + (data.detail || 'Bilinmeyen hata'), 'danger');
      }
    } catch (e) {
      KTUN.toast('Kaydedilemedi.', 'danger');
    } finally {
      document.getElementById('saveMsg').textContent = '';
    }
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', saveFeedback);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  loadData();
</script>
</body>
</html>
