<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MÜDEK – Giriş</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="assets/ktun-design.css">
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .login-shell {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(11,31,69,.08), transparent 60%),
        radial-gradient(900px 500px at 80% 90%, rgba(201,168,76,.10), transparent 60%),
        var(--cream);
    }
    .login-card {
      background:var(--white); border-radius:var(--r);
      border-top:3px solid var(--gold);
      box-shadow:var(--shadow-lg);
      width:100%; max-width:420px;
      padding:40px 36px;
      animation:fadeIn .5s ease forwards;
    }
    .login-seal {
      width:84px; height:84px; border-radius:50%;
      background:var(--white); border:2px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 14px; overflow:hidden;
    }
    .login-seal img { width:72px; height:72px; object-fit:contain; }
    .login-eyebrow {
      text-align:center; font-size:10.5px; font-weight:600; letter-spacing:1.8px;
      text-transform:uppercase; color:var(--gold-dk); margin-bottom:6px;
    }
    .login-title {
      text-align:center; font-family:'Playfair Display',serif;
      font-size:24px; font-weight:700; color:var(--navy); margin-bottom:6px;
    }
    .login-sub { text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:26px; }
    .input-group { margin-bottom:14px; }
    .login-msg { margin-top:12px; display:none; font-size:13px; padding:10px 12px; border-radius:var(--r-sm); }
    .login-msg.error { display:block; background:rgba(184,39,44,.06); color:var(--red); border:1px solid rgba(184,39,44,.2); }
    .login-msg.success { display:block; background:rgba(5,150,105,.06); color:var(--green); border:1px solid rgba(5,150,105,.25); }
    .login-foot {
      text-align:center; font-size:11.5px; color:var(--muted); padding:18px 12px; border-top:1px solid var(--border);
    }
    .login-extra { margin-top:18px; text-align:center; }
    .login-link {
      display:inline-flex; align-items:center; gap:6px;
      font-size:12.5px; color:var(--muted); font-weight:500;
    }
    .login-link:hover { color:var(--navy); }
    .login-link .mi { font-size:16px; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }
  </style>
</head>
<body>

<main class="login-shell">
  <div class="login-card">
    <div class="login-seal"><img src="ktun-logo.png" alt="KTÜ"></div>
    <div class="login-eyebrow">Konya Teknik Üniversitesi</div>
    <h1 class="login-title">MÜDEK Akreditasyon</h1>
    <div class="login-sub">Sisteme giriş için kullanıcı bilgilerinizi girin.</div>

    <form id="loginForm" autocomplete="on">
      <div class="input-group">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="input-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" type="submit" class="btn btn-lg w-full">
        <span class="mi">login</span> Giriş Yap
      </button>
      <div class="login-msg" id="errorMsg"></div>
      <div class="login-msg" id="successMsg"></div>
      <div class="login-extra">
        <a href="forgot-password.html" class="login-link">
          <span class="mi">help_outline</span> Şifremi Unuttum
        </a>
        <span style="color:var(--border); margin:0 8px;">·</span>
        <a href="index.html" class="login-link">
          <span class="mi">arrow_back</span> Ana sayfaya dön
        </a>
      </div>
    </form>
  </div>
</main>

<footer class="login-foot">
  © <span id="yr"></span> <strong>Konya Teknik Üniversitesi</strong> — MÜDEK Akreditasyon Projesi
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  const API_BASE = '';
  const redirectTarget = sessionStorage.getItem('postLoginRedirect') || 'dashboard.html';

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const loginBtn = document.getElementById('loginBtn');

  function setMsg(el, txt, klass) {
    el.textContent = txt;
    el.className = 'login-msg ' + klass;
    // clearMsgs'in bıraktığı satır içi display:none class kuralını ezer; sıfırla.
    el.style.display = '';
  }
  function clearMsgs() {
    errorMsg.style.display = 'none'; errorMsg.textContent = '';
    successMsg.style.display = 'none'; successMsg.textContent = '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    const username = document.getElementById('username').value.trim();
    // Şifre alanı kırpılmaz: change-password formu da kırpmıyor; tutarsızlık
    // hash/verify uyuşmazlığına yol açıyor. Kullanıcı şifresine boşluk dahil ne yazdıysa o gönderilir.
    const password = document.getElementById('password').value;
    if (!username || !password) {
      setMsg(errorMsg, 'Kullanıcı adı ve şifre zorunludur.', 'error');
      return;
    }
    loginBtn.disabled = true;
    const originalBtn = loginBtn.innerHTML;
    loginBtn.innerHTML = '<span class="mi">hourglass_top</span> Giriş yapılıyor…';

    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || data.message || 'Kullanıcı adı veya şifre hatalı');
      if (!data || !data.user || !data.user.role || !data.token) {
        throw new Error('Sunucudan role/token gelmedi.');
      }
      sessionStorage.setItem('user', JSON.stringify(data.user));
      sessionStorage.setItem('role', data.user.role);
      sessionStorage.setItem('token', data.token);
      sessionStorage.removeItem('postLoginRedirect');

      if (data.user.must_change_password) {
        setMsg(successMsg, 'Güvenlik için şifrenizi değiştirmeniz gerekiyor…', 'success');
        setTimeout(() => { location.href = 'change-password.html?first=1'; }, 600);
        return;
      }
      setMsg(successMsg, 'Giriş başarılı! Yönlendiriliyor…', 'success');
      setTimeout(() => { location.href = redirectTarget; }, 400);
    } catch (err) {
      setMsg(errorMsg, err.message, 'error');
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalBtn;
    }
  });
</script>
</body>
</html>
