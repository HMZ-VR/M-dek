<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belgeler – MÜDEK</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="assets/ktun-design.css">
  <style>
    .page-inner { max-width:900px; margin:0 auto; padding:32px 24px 60px; display:flex; flex-direction:column; gap:24px; }
    .doc-item {
      display:flex; align-items:center; gap:14px;
      padding:14px 18px; background:var(--white);
      border:1px solid var(--border); border-radius:var(--r-sm);
      transition:border-color var(--ease);
    }
    .doc-item:hover { border-color:var(--gold); }
    .doc-icon { width:38px; height:38px; border-radius:9px; background:rgba(11,31,69,.07); color:var(--navy); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .doc-name { font-weight:600; font-size:14px; color:var(--text); flex:1; }
    .doc-meta { font-size:12px; color:var(--muted); margin-top:3px; }
    .doc-list { display:flex; flex-direction:column; gap:8px; }
    .empty { text-align:center; padding:32px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:8px; }
    .empty .mi { font-size:40px; color:var(--border); }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  </style>
</head>
<body>

<div id="topbarMount"></div>
<div id="heroMount"></div>

<div class="page-inner">

  <!-- Admin: Belge Ekle -->
  <div id="addFormCard" class="card" style="display:none;">
    <div class="card-title"><span class="mi" style="color:var(--gold-dk)">add_circle</span> Yeni Belge Ekle</div>
    <div class="form-group">
      <label>Belge Adı</label>
      <input type="text" id="belgeAd" placeholder="Belge adını girin"/>
    </div>
    <div class="form-group">
      <label>Kategori</label>
      <select id="belgeKategori">
        <option value="Kılavuz">Kılavuz</option>
        <option value="Form">Form</option>
        <option value="Rapor">Rapor</option>
        <option value="Karar">Karar</option>
      </select>
    </div>
    <div class="form-group">
      <label>Belge Bağlantısı (PDF / URL)</label>
      <input type="url" id="belgeLink" placeholder="https://…"/>
    </div>
    <div style="text-align:right;">
      <button class="btn btn-sm" onclick="addBelge()"><span class="mi">add</span> Belge Ekle</button>
    </div>
  </div>

  <!-- Liste -->
  <div class="card">
    <div class="card-title"><span class="mi" style="color:var(--gold-dk)">folder_open</span> Belgeler</div>
    <div class="doc-list" id="belgeListesi"></div>
  </div>

</div>

<script src="assets/ktun-shell.js"></script>
<script src="help-widget.js" defer></script>
<script>
  KTUN.renderPublicTopbar({ active: 'belgeler' });
  KTUN.renderHero({ eyebrow: 'MÜDEK', title: 'Belgeler', sub: 'Akreditasyon kılavuzları, formlar ve raporlar' });

  const esc = KTUN.htmlEscape;
  const user = JSON.parse(sessionStorage.getItem('user') || '{}');
  const isAdmin = user.roles?.includes('admin') || user.role === 'admin';
  if (isAdmin) document.getElementById('addFormCard').style.display = 'block';

  function loadBelgeler() {
    const belgeler = JSON.parse(localStorage.getItem('belgeler') || '[]');
    const list = document.getElementById('belgeListesi');
    if (!belgeler.length) {
      list.innerHTML = `<div class="empty"><span class="mi">inbox</span><span>Henüz belge eklenmemiş.</span></div>`;
      return;
    }
    list.innerHTML = belgeler.map((b, idx) => `
      <div class="doc-item">
        <div class="doc-icon"><span class="mi">description</span></div>
        <div style="flex:1;min-width:0;">
          <div class="doc-name">${esc(b.ad)}</div>
          <div class="doc-meta">${esc(b.kategori)} · ${esc(b.tarih)}</div>
        </div>
        <a href="${esc(b.link)}" target="_blank" class="btn btn-outline btn-sm">
          <span class="mi">open_in_new</span> Aç
        </a>
        ${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="deleteBelge(${idx})"><span class="mi">delete</span></button>` : ''}
      </div>`).join('');
  }

  function addBelge() {
    const ad       = document.getElementById('belgeAd').value.trim();
    const kategori = document.getElementById('belgeKategori').value;
    const link     = document.getElementById('belgeLink').value.trim();
    if (!ad || !link) { KTUN.toast('Lütfen tüm alanları doldurun.', 'warning'); return; }
    const belgeler = JSON.parse(localStorage.getItem('belgeler') || '[]');
    belgeler.unshift({ ad, kategori, link, tarih: new Date().toLocaleString('tr-TR') });
    localStorage.setItem('belgeler', JSON.stringify(belgeler));
    document.getElementById('belgeAd').value = '';
    document.getElementById('belgeLink').value = '';
    KTUN.toast('Belge eklendi.', 'success');
    loadBelgeler();
  }

  function deleteBelge(index) {
    if (!confirm('Bu belgeyi silmek istediğinize emin misiniz?')) return;
    const belgeler = JSON.parse(localStorage.getItem('belgeler') || '[]');
    belgeler.splice(index, 1);
    localStorage.setItem('belgeler', JSON.stringify(belgeler));
    loadBelgeler();
  }

  loadBelgeler();
</script>
</body>
</html>
